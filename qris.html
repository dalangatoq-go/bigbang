<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#131517">
<link rel="manifest" href="manifest.webmanifest">
<title>QRIS</title>
<style>
@font-face{font-family:"DM Sans Emb";src:url(assets/fonts/DMSansEmb.woff) format("woff");font-weight:400 700;font-display:swap}
@font-face{font-family:"Bitter Emb";src:url(assets/fonts/BitterEmb.woff) format("woff");font-weight:700;font-display:swap}
:root{--bg:#131517;--card:#252a2e;--in:#212529;--tx:#c5cbd8;--wh:#f6f7f9;--gr:#0b9b1d;--sub:#b9bfcc;--ico:#8e949f;--g1:#62c76d;--g2:#0a9a1c;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden}
body{font:400 14px/1.3 "DM Sans Emb","DM Sans",Roboto,system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg,img{display:block}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden}
.s{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.s.on{display:flex;animation:in .26s cubic-bezier(.2,.8,.2,1)}
.s.back.on{animation:inb .22s ease-out}
@keyframes in{from{transform:translateX(24px);opacity:0}}
@keyframes inb{from{transform:translateX(-24px);opacity:0}}
.top{display:flex;align-items:center;height:calc(50px + var(--sat));padding:var(--sat) 15px 0 18px;gap:20px;flex:none}
.top h1{font-size:17.5px;font-weight:700;color:var(--wh)}
.x{width:24px;height:24px;color:var(--ico)}
/* ---------- scan ---------- */
#scan{background:radial-gradient(120% 80% at 50% 30%,#2a1d22 0,#17110f 55%,#0c0a0b 100%)}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
#cam.live{opacity:1}
.lines{position:absolute;left:0;right:0;top:0;height:125px;pointer-events:none;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.lines i{position:absolute;inset:-60px 0 0;background:repeating-linear-gradient(#1f7fe0 0 2px,transparent 2px 6px);opacity:.85;animation:scn 2.4s ease-in-out infinite alternate}
@keyframes scn{from{transform:translateY(-30px);opacity:.45}to{transform:translateY(52px);opacity:.95}}
.ibar{position:absolute;left:0;right:0;top:calc(15px + var(--sat));display:flex;justify-content:space-between;padding:0 22px;z-index:2}
.ibar div{display:flex;gap:11px}
.ci{width:37px;height:37px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;color:#cfd5dd;backdrop-filter:blur(6px)}
.ci.on{background:rgba(255,224,102,.9);color:#222}
.pw{position:absolute;left:0;right:0;bottom:calc(240px + var(--sab));text-align:center;color:#fff;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:7px}
.pw span{display:flex;align-items:center;gap:6px}
.pw img{height:19px}
.pill{display:flex;align-items:center;gap:7px;height:30px;padding:0 17px;border-radius:15px;background:linear-gradient(90deg,#33bfd9,#0a9a2a);border:1px solid #118a35;color:#fff;font-weight:700;font-size:13.2px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:24px 24px 0 0;padding:11px 15px calc(18px + var(--sab));animation:up .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(60%)}}
.hd{width:22px;height:3px;border-radius:2px;background:#4a4f55;margin:0 auto 14px}
.ban{display:flex;align-items:center;gap:9px;height:37px;padding:0 5px 0 9px;border-radius:20px;border:1px solid #2c3236;background:linear-gradient(90deg,#1b2124 0,#17525e 55%,#2563d8);color:#e6e9ee;font-weight:700;font-size:12.5px;margin-bottom:8px}
.ban img{height:24px}.ban b{flex:1;font-weight:700}
.ban i{width:30px;height:26px;border-radius:13px;background:#14171a;display:grid;place-items:center;color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:5px;border-radius:18px;background:#1b1f22;border:1px solid #23282c}
.tile{height:75px;border-radius:14px;background:linear-gradient(#2d3338,#23282c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:12.5px;color:#c9cfd9;text-align:center;line-height:1.25}
.tile img{height:22px;max-width:60px;object-fit:contain}
.tile:active{filter:brightness(1.25)}
.sheet h3{font-size:15px;color:var(--wh);margin-top:20px;font-weight:700}
/* ---------- merchant + nominal ---------- */
.m{display:flex;gap:14px;padding:0 15px;margin-top:6px;flex:none}
.av{width:37px;height:37px;border-radius:9px;background:#1b1e21;border:1px solid #23272b;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.mi{min-width:0;flex:1}
.mn{display:flex;align-items:center;gap:5px;color:var(--wh);font-weight:700;font-size:14.2px}
.mn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp{display:flex;align-items:center;gap:6px;margin-top:2px;color:var(--sub);font-size:11.6px;font-weight:600}
.mp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi.open .mp span{white-space:normal;word-break:break-all}
.mp svg{flex:none;color:var(--gr);transition:transform .2s}.mi.open .mp svg{transform:rotate(180deg)}
.amt{position:relative;margin:13px 15px 0;height:93px;border-radius:22px;background:var(--card);padding:15px;flex:none;box-shadow:0 1px 0 #2f353a inset}
.amt div{height:100%;border-radius:12px;background:var(--in);box-shadow:inset 0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font:700 22px "Bitter Emb",Georgia,serif;color:#e8eaed;letter-spacing:.2px;padding:0 40px;overflow:hidden;white-space:nowrap}
.amt .pen{position:absolute;right:30px;top:50%;margin-top:-8px;color:var(--gr);display:none}
#rev .amt .pen{display:block}
.pad{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);padding:0 6px}
.pad button{height:71px;font:700 22px "Bitter Emb",Georgia,serif;color:var(--wh);display:grid;place-items:center}
.pad button:active{background:rgba(255,255,255,.06);border-radius:14px}
.pad svg{color:#9aa1ab}
.go{display:flex;align-items:center;justify-content:center;height:41px;margin:6px 15px calc(14px + var(--sab));border-radius:21px;background:linear-gradient(var(--g1),var(--g2));color:#fff;font-weight:700;font-size:15px;box-shadow:0 0 0 1px #0a7a18;transition:opacity .2s,filter .2s;flex:none}
.go[disabled]{opacity:.38;filter:grayscale(.6)}
.go:not([disabled]):active{filter:brightness(1.15)}
/* ---------- review ---------- */
.pg{position:relative;height:2px;margin:13px 15px 0;background:#3b2cf0;border-radius:2px;overflow:hidden;flex:none;transition:opacity .3s}
.pg::after{content:"";position:absolute;top:0;bottom:0;width:45%;background:#f6c9c0;animation:run 1.15s ease-in-out infinite,hue 2.3s linear infinite}
@keyframes run{from{left:-45%}to{left:100%}}
@keyframes hue{0%{background:#f6c9c0}35%{background:#9b86f5}70%{background:#a6e22e}100%{background:#f6c9c0}}
#rev.ok .pg::after{animation:run 1.8s ease-in-out infinite;background:#a6e22e}
.pr,.det{margin:8px 15px 0;border-radius:15px;background:var(--card);border:1px solid #2b3034;flex:none}
.pr{display:none;align-items:center;gap:11px;height:52px;padding:0 10px 0 12px;font-weight:700;font-size:13.2px;color:var(--wh)}
.pr.show{display:flex;animation:drop .4s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.pr b{flex:1}.pr img{height:22px}
.pr i,.cv{width:31px;height:31px;border-radius:9px;background:#1e2226;border:1px solid #2d3236;display:grid;place-items:center;color:#9aa1ab}
.det{padding:0 15px}
.det>button{display:flex;align-items:center;justify-content:space-between;width:100%;height:50px;font-weight:700;font-size:15px;color:var(--wh)}
.det>button svg{transition:transform .25s;color:#9aa1ab}.det.open>button svg{transform:rotate(180deg)}
.rows{max-height:0;overflow:hidden;transition:max-height .3s ease}
.det.open .rows{max-height:160px}
.rows p{display:flex;justify-content:space-between;height:30px;align-items:center;font-size:13px}
.rows p:last-child{color:var(--wh);font-weight:700;margin-bottom:6px}
.bs{position:absolute;left:0;right:0;bottom:0;border-radius:24px 24px 0 0;background:#2a2f33;padding:15px 15px calc(15px + var(--sab));transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.8,.2,1)}
#rev.ok .bs{transform:none}
.bx{border-radius:20px;background:#2c3237;border:1px solid #1f2428;padding:15px 13px 13px}
.gp{display:flex;align-items:center;gap:11px;font-weight:700;font-size:15px;color:var(--wh);margin-bottom:17px}
.gp b{flex:1;font-weight:700}
.bayar{display:flex;align-items:center;justify-content:space-between;width:100%;height:41px;padding:0 14px 0 19px;border-radius:21px;background:linear-gradient(var(--g1),var(--g2));color:#fff;font-weight:700;font-size:15px}
.bayar span{display:flex;align-items:center;gap:13px}
.dim{position:absolute;inset:0;background:rgba(150,152,156,.815);z-index:3;transition:opacity .35s}
.sp{position:absolute;left:15px;right:15px;bottom:calc(14px + var(--sab));height:41px;border-radius:21px;background:linear-gradient(var(--g1),var(--g2));z-index:4;display:grid;place-items:center;transition:opacity .25s}
#rev.ok .dim,#rev.ok .sp{opacity:0;pointer-events:none}
.sp svg,.go svg.sp2{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- PIN + berhasil ---------- */
.ov{position:absolute;inset:0;z-index:6;background:rgba(0,0,0,.55);display:none;align-items:flex-end;opacity:0;transition:opacity .25s}
.ov.on{display:flex;opacity:1}
.ps{width:100%;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 0 calc(8px + var(--sab));animation:up .35s cubic-bezier(.2,.8,.2,1) both}
.ps h2{text-align:center;color:var(--wh);font-size:16px;font-weight:700}
.dots{display:flex;gap:14px;justify-content:center;margin:20px 0 8px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid #4b5158;transition:.15s}
.dots i.f{background:var(--g1);border-color:var(--g1);transform:scale(1.1)}
.dots.err{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.em{min-height:34px;text-align:center;color:#e5484d;font-size:12.5px;padding:0 24px}
#ok{background:var(--bg);z-index:7;align-items:center;justify-content:center;text-align:center;gap:6px}
#ok svg{width:84px;height:84px;margin-bottom:12px}
#ok circle{fill:none;stroke:var(--g2);stroke-width:5;stroke-dasharray:226;stroke-dashoffset:226;animation:dr .6s .1s ease-out forwards}
#ok path{fill:none;stroke:var(--g2);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:dr .4s .6s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
#ok h2{color:var(--wh);font-size:19px}#ok .go{align-self:stretch;margin-top:30px}
.tt{position:absolute;left:50%;bottom:calc(120px + var(--sab));transform:translate(-50%,10px);background:#3b4046;color:#fff;font-size:12px;padding:8px 14px;border-radius:18px;opacity:0;pointer-events:none;transition:.2s;z-index:9;white-space:nowrap}
.tt.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">

<!-- 1. SCAN -->
<section class="s on" id="scan">
  <video id="cam" playsinline muted autoplay></video>
  <div class="lines"><i></i></div>
  <div class="ibar">
    <button class="ci" data-x="back" aria-label="Kembali"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 5l-7 7 7 7"/></svg></button>
    <div>
      <button class="ci" data-t="Pusat bantuan" aria-label="Bantuan"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="currentColor"/><text x="12" y="17" text-anchor="middle" font-size="14" font-weight="800" fill="#2a2d31" font-family="sans-serif">?</text></svg></button>
      <button class="ci" id="up" aria-label="Upload QR"><img src="assets/qris/ico-upload.png" alt="" height="19"></button>
      <button class="ci" id="fl" aria-label="Senter"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg></button>
    </div>
  </div>
  <div class="pw"><span>Powered by <img src="assets/qris/qris-logo.png" alt="QRIS"></span>
    <button class="pill" data-t="Terima pembayaran QRIS belum tersedia"><svg width="17" height="17" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#fff"/><path d="M7 12.3l3.2 3.2L17 8.8" fill="none" stroke="#19a3c4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Terima Pembayaran QRIS Disini</button></div>
  <div class="sheet"><div class="hd"></div>
    <button class="ban" data-t="Terima pembayaran QRIS belum tersedia" style="width:100%;text-align:left"><img src="assets/qris/ico-promo.png" alt=""><b>Terima pembayaran QRIS di sini!</b><i><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg></i></button>
    <div class="tiles">
      <button class="tile" data-t="Tampilin QRIS belum tersedia"><img src="assets/qris/alfamart.png" alt="Alfamart">Tampilin<br>QRIS</button>
      <button class="tile" data-t="QRIS Tap belum tersedia"><img src="assets/qris/ico-tap.png" alt="">QRIS Tap</button>
      <button class="tile" id="up2"><img src="assets/qris/ico-upload.png" alt="">Upload QR</button>
    </div>
    <h3>Promo QRIS yang lagi berlangsung</h3>
  </div>
</section>

<!-- 2. NOMINAL -->
<section class="s" id="nom">
  <div class="top"><button class="x" data-x="back" aria-label="Tutup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button><h1>Isi nominal</h1></div>
  <div class="m" data-m></div>
  <div class="amt"><div data-a>Rp0</div></div>
  <div class="pad" id="pad"></div>
  <button class="go" id="rv" disabled>Review pembayaran</button>
</section>

<!-- 3. REVIEW -->
<section class="s" id="rev">
  <div class="top"><button class="x" data-x="back" aria-label="Tutup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button><h1>Review pembayaran</h1></div>
  <div class="m" data-m></div>
  <div class="amt"><div data-a>Rp0</div><svg class="pen" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.3V21h3.7L18.8 8.9l-3.7-3.7zM20.7 7a1 1 0 000-1.4l-2.3-2.3a1 1 0 00-1.4 0l-1.8 1.8 3.7 3.7z"/></svg></div>
  <div class="pg"></div>
  <button class="pr" id="promo" data-t="Belum ada promo untuk transaksi ini"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 1l2.6 2 3.2-.3 1.2 3 2.9 1.4-.6 3.200L22.6 12l-1.300 2.700.6 3.200-2.900 1.400-1.200 3-3.200-.3L12 23l-2.600-2-3.200.3-1.200-3-2.900-1.400.6-3.200L1.400 12l1.300-2.700-.6-3.200 2.900-1.400 1.200-3 3.200.3z" fill="#ff6a00"/><path d="M9 15l6-6M9.500 9.500h.01M14.500 14.500h.01" stroke="#3a1a00" stroke-width="2.200" stroke-linecap="round"/></svg><b>Cek promo buat transaksi ini</b><i><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></i></button>
  <div class="det" id="det"><button type="button">Rincian pembayaran<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="rows"><p><span>Jumlah</span><span data-j>Rp0</span></p><p><span>Biaya layanan</span><span>Rp0</span></p><p><span>Total bayar</span><span data-j>Rp0</span></p></div></div>
  <div class="bs"><div class="bx">
    <div class="gp"><svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#1c2a30"/><circle cx="17" cy="17" r="12.500" fill="#19a8d6"/><rect x="10.500" y="12.500" width="12" height="9" rx="2.300" fill="#fff"/><rect x="17" y="15.300" width="6.500" height="3.400" rx="1.700" fill="#19a8d6" stroke="#fff" stroke-width="1.300"/></svg><b>GoPay</b><span class="cv"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></div>
    <button class="bayar" id="bayar"><b>Bayar</b><span><b data-j>Rp0</b><svg width="24" height="22" viewBox="0 0 24 22" fill="#eceef1"><path d="M2 1.500l20 9.500L2 20.500l2.500-8.200L14 11 4.500 9.700z"/></svg></span></button>
  </div></div>
  <div class="dim"></div>
  <div class="sp"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.600" stroke-linecap="round"><path d="M12 3a9 9 0 019 9" opacity=".95"/></svg></div>
</section>

<!-- PIN -->
<div class="ov" id="pin"><div class="ps"><h2>Masukkan PIN kamu</h2><div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="em" id="em"></div><div class="pad" id="pad2"></div></div></div>

<!-- BERHASIL -->
<section class="s" id="ok"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="36"/><path d="M26 43l11 11 21-23"/></svg><h2>Pembayaran berhasil</h2><div id="okt"></div><button class="go" id="done" style="margin:30px 15px 0;width:calc(100% - 30px)">Selesai</button></section>

<div class="tt" id="tt"></div>
<input type="file" id="file" accept="image/*" hidden>
</div>

<script src="js/config.js"></script>
<script>
(function(){'use strict';
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
var M=null,amt='',scanOn=false,stream=null,det=null,busy=false,pin='',timers=[];
var ST=['scan','nom','rev'],cur='scan';
function rp(n){return 'Rp'+Number(n||0).toLocaleString('id-ID')}
function toast(t){var e=$('#tt');e.textContent=t;e.classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(function(){e.classList.remove('on')},2000)}
function later(f,ms){timers.push(setTimeout(f,ms))}
function clr(){timers.forEach(clearTimeout);timers=[]}

/* ---- navigasi antar layar (tombol back perangkat ikut bekerja) ---- */
function show(n,back){cur=n;$$('.s').forEach(function(s){s.classList.remove('on','back')});var e=$('#'+n);if(back)e.classList.add('back');e.classList.add('on');
  if(n==='scan')camStart();else camStop();
  if(n==='rev')review();else{clr();e&&$('#rev').classList.remove('ok')}}
function push(n){history.pushState({s:n},'');show(n)}
addEventListener('popstate',function(e){var s=e.state&&e.state.s||'scan';if($('#pin').classList.contains('on')){closePin();history.pushState({s:'rev'},'');return}show(s,true)});
history.replaceState({s:'scan'},'');
document.addEventListener('click',function(e){var x=e.target.closest('[data-x]');if(x){if(cur==='scan')location.href='index.html';else history.back();return}
  var t=e.target.closest('[data-t]');if(t)toast(t.getAttribute('data-t'))});

/* ---- parser QRIS (EMV TLV) ---- */
function tlv(s){var o={},i=0;while(i+4<=s.length){var k=s.substr(i,2),l=parseInt(s.substr(i+2,2),10);if(isNaN(l))break;o[k]=s.substr(i+4,l);i+=4+l}return o}
function parse(q){q=String(q||'').trim();if(q.indexOf('000201')!==0||q.indexOf('5802ID')<0)return null;
  var t=tlv(q),acc=null,k;for(k=26;k<=51;k++){var kk=('0'+k).slice(-2);if(t[kk]){acc=tlv(t[kk]);break}}
  var ex=t['62']?tlv(t['62']):{},dom=acc&&acc['00']||'',m=/^ID\.CO\.([A-Z0-9]+)\./i.exec(dom);
  return{name:t['59']||'Merchant',city:t['60']||'',postal:t['61']||'',pan:acc&&(acc['01']||acc['02'])||'',acq:m?m[1].toUpperCase():'',term:ex['07']||'',amount:t['54']?Math.round(parseFloat(t['54'])):0}}
function loc(m){return [m.city,'ID',m.postal].filter(Boolean).join(', ')}

/* ---- merchant + nominal ---- */
function fillM(){$$('[data-m]').forEach(function(e){e.textContent='';
  var av=document.createElement('div');av.className='av';av.textContent=M.name.split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase();
  var mi=document.createElement('div');mi.className='mi';
  mi.innerHTML='<div class="mn"><span></span><svg width="19" height="19" viewBox="0 0 24 24"><path d="M12 1.500l2.500 1.800 3.100-.2 1 2.900 2.600 1.700-.9 3 .9 3-2.600 1.700-1 2.900-3.100-.2-2.500 1.800-2.500-1.800-3.100.2-1-2.900-2.600-1.700.9-3-.9-3 2.600-1.700 1-2.900 3.100.2z" fill="#19a3d4"/><path d="M8 12.200l2.800 2.800 5.200-5.600" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="mp"><span></span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></div>';
  $('.mn span',mi).textContent=M.name+(M.acq?' - '+M.acq:'');
  $('.mp span',mi).textContent=loc(M)+(M.pan?', Merchant PAN: '+M.pan:'');
  $('.mp',mi).onclick=function(){mi.classList.toggle('open')};
  e.appendChild(av);e.appendChild(mi)})}
function fillA(){$$('[data-a]').forEach(function(e){e.textContent=rp(amt)});$$('[data-j]').forEach(function(e){e.textContent=rp(amt)});$('#rv').disabled=!(+amt>0)}
function pad(el,fn,tri){var k=['1','2','3','4','5','6','7','8','9','0',tri?'000':'','b'];el.textContent='';
  k.forEach(function(v){var b=document.createElement('button');b.type='button';if(v==='b')b.innerHTML='<svg width="30" height="26" viewBox="0 0 30 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 2h18a2 2 0 012 2v18a2 2 0 01-2 2H9L1 13z"/><path d="M14 9l8 8M22 9l-8 8" stroke-linecap="round"/></svg>';else b.textContent=v;
    if(!v)b.style.visibility='hidden';b.onclick=function(){fn(v)};el.appendChild(b)})}
pad($('#pad'),function(v){if(v==='b')amt=amt.slice(0,-1);else{var n=(amt+v).replace(/^0+/,'');if(n.length<=10)amt=n}fillA()},true);
function mulai(m){M=m;amt=m.amount?String(m.amount):'';fillM();fillA();m.amount?push('rev'):push('nom')}

/* ---- review: loading -> siap -> promo ---- */
$('#rv').onclick=function(){var b=this;b.innerHTML='<svg class="sp2" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.600" stroke-linecap="round"><path d="M12 3a9 9 0 019 9"/></svg>';
  setTimeout(function(){push('rev');b.textContent='Review pembayaran'},350)};
function review(){var r=$('#rev');r.classList.remove('ok');$('#promo').classList.remove('show');clr();
  later(function(){r.classList.add('ok')},1250);later(function(){$('#promo').classList.add('show')},2200)}
$('#rev .amt').onclick=function(){if(+amt>0&&!M.amount)history.back()};
$('#det>button').onclick=function(){$('#det').classList.toggle('open')};

/* ---- PIN dan simpan ke gcx ---- */
function dots(){$$('#dots i').forEach(function(d,i){d.classList.toggle('f',i<pin.length)})}
function closePin(){$('#pin').classList.remove('on');pin='';dots();$('#em').textContent=''}
pad($('#pad2'),function(v){if(busy)return;if(v==='b')pin=pin.slice(0,-1);else if(pin.length<6)pin+=v;dots();$('#em').textContent='';if(pin.length===6)kirim()},false);
$('#bayar').onclick=function(){pin='';dots();$('#pin').classList.add('on')};
$('#pin').onclick=function(e){if(e.target===this&&!busy)closePin()};
function kirim(){busy=true;var c=window.GP_CFG||{};
  fetch(c.url+'/rest/v1/rpc/input_gcx',{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json'},
    body:JSON.stringify({pin:pin,p_jumlah:+amt,p_acquirer_name:M.acq||null,p_merchant_name:M.name,p_merchant_location:loc(M),p_merchant_pan:M.pan||null,p_terminal_id:M.term||null})})
  .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j&&(j.message||j.hint)||'Gagal');return j})})
  .then(function(){busy=false;closePin();$('#okt').textContent=rp(amt)+' ke '+M.name;history.replaceState({s:'ok'},'');show('ok')})
  .catch(function(e){busy=false;pin='';dots();var d=$('#dots');d.classList.remove('err');void d.offsetWidth;d.classList.add('err');$('#em').textContent=e.message||'PIN salah atau jaringan bermasalah'})}
$('#done').onclick=function(){location.href='index.html'};

/* ---- kamera + unggah QR ---- */
function jsqr(cb){if(window.jsQR)return cb();var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';s.onload=cb;document.head.appendChild(s)}
function baca(src,w,h,cb){if(det){det.detect(src).then(function(r){cb(r[0]&&r[0].rawValue)},function(){cb(null)});return}
  jsqr(function(){var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.drawImage(src,0,0,w,h);var r=window.jsQR&&jsQR(x.getImageData(0,0,w,h).data,w,h);cb(r&&r.data)})}
function hasil(v){var m=parse(v);if(!m){toast('QR bukan QRIS yang valid');return false}mulai(m);return true}
function loop(){if(!scanOn)return;var v=$('#cam');if(v.readyState>=2&&!busy){busy=true;baca(v,Math.min(640,v.videoWidth),Math.round(Math.min(640,v.videoWidth)*v.videoHeight/v.videoWidth),function(q){busy=false;if(q&&scanOn&&hasil(q))return});}
  setTimeout(loop,280)}
function camStart(){if(scanOn)return;scanOn=true;if('BarcodeDetector' in window&&!det)try{det=new BarcodeDetector({formats:['qr_code']})}catch(_){}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}).then(function(s){if(!scanOn){s.getTracks().forEach(function(t){t.stop()});return}
    stream=s;var v=$('#cam');v.srcObject=s;v.play().catch(function(){});v.classList.add('live');loop()}).catch(function(){toast('Kamera tidak bisa dibuka. Pakai Upload QR.')})}
function camStop(){scanOn=false;if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}$('#cam').classList.remove('live');$('#fl').classList.remove('on')}
$('#fl').onclick=function(){var t=stream&&stream.getVideoTracks()[0],on=!this.classList.contains('on'),b=this;
  if(!t){toast('Kamera belum aktif');return}t.applyConstraints({advanced:[{torch:on}]}).then(function(){b.classList.toggle('on',on)},function(){toast('Senter tidak didukung')})};
function pilih(){$('#file').click()}$('#up').onclick=pilih;$('#up2').onclick=pilih;
$('#file').onchange=function(){var f=this.files[0];this.value='';if(!f)return;
  createImageBitmap(f).then(function(bm){baca(bm,bm.width,bm.height,function(q){if(!q)toast('QR tidak terbaca dari gambar');else hasil(q)})},function(){toast('Gambar tidak bisa dibaca')})};

/* contoh data untuk uji tanpa QR: qris.html?demo=1 */
if(/[?&]demo=1/.test(location.search))setTimeout(function(){mulai({name:'Toko Grosir Cendana, Kont',acq:'DANA',city:'Bandung',postal:'40272',pan:'9360091530',term:'',amount:0})},1400);
camStart();
})();
