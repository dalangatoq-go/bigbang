/* ===== shared.css — dipakai semua halaman ===== */
:root{
  --page:#131517; --card:#25292e; --card-bd:#2d3237; --tile:#34383c;
  --txt:#ffffff; --txt2:#c4c8cc; --muted:#9aa3aa; --orange:#ffad4b; --orange-bg:#cc7000;
  --blue:#00aed6; --green:#1f9e44; --nav:#252a2e; --nav-bd:#373b3f;--nav-ic:#a3abb3;--nav-lb:#c5cbd8; --pill-act:#213e47;
  --lihat-bg:#172718; --lihat-bd:#1f5427; --sw-bg:#25292e;
}
body.light{
  --page:#f2f4f6; --card:#ffffff; --card-bd:#e4e8eb; --tile:#f0f2f4;
  --txt:#1a1d20; --txt2:#4a5157; --muted:#6c757d; --nav:#ffffff; --nav-bd:#e4e8eb; --nav-ic:#6c757d; --nav-lb:#4a5157; --pill-act:#d6f1f8;
  --lihat-bg:#e9f5ea; --lihat-bd:#b9ddbd; --sw-bg:#e4e8eb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#131517}html:has(body.light){background:#f2f4f6}
html,body{touch-action:pan-x pan-y;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;font-family:'Plus Jakarta Sans','Inter','Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;letter-spacing:-.02em}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
.app{position:relative;width:100%;max-width:430px;height:100vh;height:var(--app-h,100vh);height:100dvh;margin:0 auto;background:var(--page);overflow:hidden;touch-action:pan-x pan-y;isolation:isolate}
#ui{position:absolute;left:0;top:0;width:360px;height:100%;overflow:hidden;background:var(--page);--k:1;--safe-t:calc(env(safe-area-inset-top,0px) / var(--k));--safe-b:calc(env(safe-area-inset-bottom,0px) / var(--k))}
/* jalur cadangan (tanpa CSS zoom): kanvas diskalakan dengan transform, jadi tinggi dibagi k */
@supports not (zoom:1){#ui{height:calc(100% / var(--k))}}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.content{position:relative;padding-bottom:calc(156px + var(--safe-b))}


a{color:inherit;text-decoration:none;-webkit-user-drag:none}
/* ---------- bottom nav (FAB, ikon & ukuran diekstrak dari referensi) ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;height:calc(61px + var(--safe-b));padding-bottom:var(--safe-b);background:linear-gradient(to bottom,var(--nav) 0 61px,#000 61px 100%);border-top:1px solid var(--nav-bd);z-index:20}
.ni{position:absolute;top:0;width:72px;height:60px;display:flex;flex-direction:column;align-items:center;color:var(--nav-ic);font-size:11.25px;line-height:1;font-weight:400}
.ni .pl{position:absolute;left:13.5px;top:6px;width:45px;height:29px;border-radius:15px;background:transparent;transition:background .2s}
.ni.on .pl{background:var(--pill-act)}
.ni .mi{position:absolute;left:24px;top:9px;width:24px;height:24px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.ni .lb{position:absolute;left:-10px;right:-10px;top:39px;text-align:center;color:var(--nav-lb);white-space:nowrap}
.ni.on{color:var(--blue)}
.ni.on .lb{font-weight:700;font-size:11.45px}
.ni:active .pl{background:rgba(120,130,140,.22)}

#ptr{position:absolute;left:50%;top:0;width:32px;height:32px;margin-left:-16px;opacity:0;pointer-events:none;z-index:25;transform:translateY(-40px);will-change:transform,opacity}
#ptr svg{width:32px;height:32px;display:block;overflow:visible;will-change:transform}
#ptr .dt{fill:#19608f}
#ptr .tl,#ptr .bl,#ptr .sq-b,#ptr .sq-l{fill:#00b0d8}
#ptr .tr,#ptr .br,#ptr .sq-t,#ptr .sq-r{fill:#f8a848}

/* ===== Rasa aplikasi native (hasil audit) ===== */
/* transisi mulus antar halaman (Chrome/Android/Edge; browser lain mengabaikan) */
@view-transition{navigation:auto}
::view-transition-old(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:gp-in .14s ease both;mix-blend-mode:normal}
/* Isi kanvas transisi dengan warna halaman agar area snapshot transparan tidak
   memperlihatkan latar hitam default Chromium selama perpindahan dokumen. */
:root::view-transition{background-color:#131517}
html:has(body.light)::view-transition{background-color:#f2f4f6}
@keyframes gp-out{to{opacity:0}}
@keyframes gp-in{from{opacity:0}}

/* banner offline */
.gp-off{position:absolute;left:0;right:0;top:0;z-index:60;padding:calc(var(--safe-t) + 6px) 12px 6px;background:#3a3f45;color:#fff;font-size:12px;font-weight:600;text-align:center;line-height:16px;transform:translateY(-110%);transition:transform .22s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.gp-off.show{transform:none}
.gp-off.ok{background:#0f7a1c}

/* toast pembaruan (ketuk untuk muat ulang) */
.gp-upd{position:absolute;left:12px;right:12px;bottom:calc(72px + var(--safe-b));z-index:70;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:14px;background:#e9edf0;color:#15181b;font-size:12.5px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.28);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s}
.gp-upd.show{opacity:1;transform:none;pointer-events:auto}
.gp-upd span{flex:1}
.gp-upd button{height:30px;padding:0 14px;border-radius:15px;background:var(--blue);color:#fff;font-weight:700;font-size:12px}
.gp-upd .x{width:28px;height:28px;padding:0;background:none;color:#6c757d;font-size:18px;line-height:1}

/* keyboard layar terbuka: sembunyikan nav bawah agar tidak menutupi kolom isian */
html.gp-kb .nav{display:none}

/* skeleton loading */
.skel{position:relative;overflow:hidden;color:transparent!important;background:var(--tile)!important;border-radius:8px;-webkit-user-select:none;user-select:none}
.skel *{visibility:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);transform:translateX(-100%);animation:gp-shim 1.2s infinite}
body.light .skel::after{background:linear-gradient(90deg,transparent,rgba(0,0,0,.06),transparent)}
@keyframes gp-shim{to{transform:translateX(100%)}}

/* hormati preferensi kurangi gerakan */
@media (prefers-reduced-motion:reduce){
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
  html.gp-ready .app{animation:none}
  .skel::after{animation:none}
  .scroll{scroll-behavior:auto}
}


/* bar navigasi/gestur perangkat di bawah: selalu hitam di semua halaman (setelah splash).
   Hanya mengisi area safe-area bawah, jadi tidak menyentuh splash (manifest + apple-touch-startup-image). */
body:not([data-tab])::after,body.mk::after{content:"";position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px);background:#000;z-index:2147483647;pointer-events:none}


/* ===== Bottom bar sebagai komponen statis (js/nav.js) ===== */
/* Halaman fitur & alur masuk (tanpa data-tab tab) tidak pernah menampilkan bottom bar. */
body:not([data-tab]) .nav,body.mk .nav{display:none!important}
/* Saat pindah antar tab, bar tetap diam di tempat (tidak ikut memudar bersama isi halaman).
   Bila halaman tujuan/asal tidak punya bar (halaman fitur), bar memudar bersama halaman. */
.nav{view-transition-name:gp-nav}
::view-transition-group(gp-nav){animation:none}
::view-transition-old(gp-nav),::view-transition-new(gp-nav){animation:none}
::view-transition-old(gp-nav):only-child{animation:gp-out .12s ease both}
::view-transition-new(gp-nav):only-child{animation:gp-in .18s ease both}

/* ===== masuk.css — alur keluar/masuk: onboarding, nomor HP, PIN (diekstrak dari 3 screenshot, skala 360dp) ===== */
body.mk #ui{--dy:max(calc(var(--safe-t) - 24px),0px)}
body.mk{--bg:#07111f;--surf:#1b2736;--surf-bd:#2f3e52;--neon:#1ed760;--neon-bg:#0b3a2a;--t2:#a9b4c8}
body.mk .app,body.mk #ui{background:var(--bg)}
.mk .ab{position:absolute;display:grid;place-items:center;color:#fff}
.mk .ab:active{filter:brightness(1.25)}
.mk .abtn{width:36px;height:36px;border-radius:50%;background:var(--surf)}
.mk .abtn .qm{width:15px;height:15px;border-radius:50%;background:#fff;color:var(--bg);font-size:11px;font-weight:800;line-height:15px;text-align:center}
.mk .lang{height:35.6px;border-radius:18px;background:var(--surf);padding:0 12px 0 11px;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;white-space:nowrap}
.mk .lang svg{width:18px;height:18px;flex:none}
.mk .txt{position:absolute;white-space:nowrap;line-height:1}
.mk .pill-link{position:absolute;display:flex;align-items:center;background:var(--neon-bg);color:var(--neon);font-weight:700;border-radius:999px;white-space:nowrap}
.mk .pill-link:active{filter:brightness(1.3)}

/* ---------- 1. Onboarding (biru) ---------- */
body.onb .app,body.onb #ui{background:linear-gradient(180deg,#0b6be6 0%,#0a5cd6 55%,#0847b8 100%)}
body.onb .abtn,body.onb .lang{background:#0a55c8;box-shadow:0 2px 6px rgba(0,30,90,.28)}
body.onb .abtn .qm{color:#0a55c8}
.onb .abtn{left:141.2px;top:calc(var(--safe-t) + 10.7px);width:37.7px;height:37.7px}
.onb .lang{left:193.7px;top:calc(var(--safe-t) + 10.7px);width:150px;height:36.4px;font-size:12.9px;padding:0 0 0 10px}
.onb .mid{position:absolute;left:0;right:0;top:calc(46.5% - 205.5px);height:411px}
.onb h1{position:absolute;left:0;right:0;top:0;text-align:center;color:#fff;font-weight:700;font-size:23.1px;line-height:30.9px;letter-spacing:-.01em}
.onb .ill{position:absolute;left:0;top:94.9px;width:360px;height:218.6px;display:block;overflow:visible}
.onb .sub{position:absolute;left:0;right:0;top:327.9px;text-align:center;color:#fff;font-size:15.4px;line-height:22.7px;font-weight:400;letter-spacing:-.01em}
.onb .dots{position:absolute;left:0;right:0;top:401.7px;height:7.7px}
.onb .dots i{position:absolute;top:0;width:7.7px;height:7.7px;border-radius:50%;background:#9db9e8}
.onb .dots i.on{width:26.6px;background:#ffe04a;border-radius:999px}
.onb .cta{position:absolute;left:15.9px;width:328.3px;height:49.3px;bottom:calc(var(--safe-b) + 28px)}

.mk .cta{border-radius:999px;color:#fff;font-weight:700;font-size:18px;display:grid;place-items:center;letter-spacing:-.01em}
.onb .cta{background:linear-gradient(180deg,#37d24b,#1fa82f);box-shadow:0 3px 0 rgba(8,120,28,.55),0 6px 14px rgba(0,40,10,.28)}
.mk .cta:active{filter:brightness(1.1)}

/* ---------- 3. Nomor HP (referensi 980px -> 360dp; Y = posisi pada gambar, termasuk status bar 24dp) ---------- */
.hp .back{left:20.2px;top:calc(37px + var(--dy));width:20px;height:20px}
.hp .back svg{width:19px;height:19px}
.hp .abtn{left:134.4px;top:calc(29px + var(--dy));width:36px;height:36px}
.hp .lang{left:186.2px;top:calc(29.4px + var(--dy));width:158.7px}
.hp h1{position:absolute;left:20.2px;top:calc(85.3px + var(--dy));font-family:'MkLora','Young Serif',Georgia,'Times New Roman',serif;font-size:25.7px;line-height:30px;font-weight:700;letter-spacing:-.03em;color:#fff;white-space:nowrap}
.hp .sub{position:absolute;left:20.2px;right:14px;top:calc(124.2px + var(--dy));color:#dde3ee;font-size:14.2px;line-height:17.6px;font-weight:400;letter-spacing:-.015em;white-space:nowrap}

    GP._sb=window.__sb||(window.__sb=window.supabase.createClient(window.GP_CFG.url,window.GP_CFG.key)); // satu koneksi realtime dipakai bersama push.js
    return GP._sb;
  };
  // kembali ke halaman sebelumnya; kalau halaman dibuka langsung, pakai fallback
  GP.back=function(fallback){
    var ref=document.referrer,same=true;
    if(ref) same=safe(function(){return new URL(ref).origin===location.origin});
    if(history.length>1&&same!==false) GPL.back(function(){history.back()}); else GPL.go(fallback,1);
  };

  // ---- Zoom halaman dikunci (keputusan produk): lapisan 1 viewport meta, lapisan 2 CSS touch-action:pan-x pan-y,
  // lapisan 3 skrip di bawah (pinch Safari iOS, pinch dua jari, double-tap, Ctrl+scroll, Ctrl +/-/0).
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev,function(e){e.preventDefault()},{passive:false});
  });
  document.addEventListener('touchmove',function(e){
    if(e.touches.length>1&&e.cancelable) e.preventDefault();
  },{passive:false});
  var lastTap=0;
  document.addEventListener('touchend',function(e){
    var n=Date.now(); if(n-lastTap<300&&e.cancelable) e.preventDefault(); lastTap=n;   // double-tap zoom
  },{passive:false});
  addEventListener('wheel',function(e){ if(e.ctrlKey&&e.cancelable) e.preventDefault(); },{passive:false});
  addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&['+','=','-','_','0'].indexOf(e.key)>=0) e.preventDefault();
  });
  // Auto-zoom iOS saat fokus input berfont < 16px dicegah oleh maximum-scale=1 pada viewport meta.

  // ---- Layer (bottom sheet / popup): tombol Back perangkat menutup layer, bukan keluar halaman.
  // GP.layer.push(fnTutup) saat layer dibuka; GP.layer.pop() saat layer ditutup lewat UI (scrim/tombol).
  var layers=[];
  GP.layer={
    push:function(close){ layers.push(close); safe(function(){history.pushState({gpLayer:layers.length},'')}); },
    pop:function(){                       // ditutup lewat UI: buang entri riwayat milik layer itu
      if(!layers.length) return;

  addEventListener('popstate',function(){

    var n=(history.state&&history.state.gpLayer)||0;
    while(layers.length>n){ var f=layers.pop(); safe(f); }
  });

  // ---- klik: pindah halaman (data-page) & item yang belum punya backend (data-t)
  document.addEventListener('click',function(e){
    var p=e.target.closest('[data-page]');
    if(p){GPL.go(p.getAttribute('data-page'));return}
    var el=e.target.closest('[data-t]'); if(!el) return;
    if(el.hasAttribute('data-go')) return;
    var t=el.getAttribute('data-t'),href=el.getAttribute('data-href');
    if(href){var a=document.createElement('a');a.href=href;a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove();return}
    /* placeholder "belum terhubung ke server" dihapus: ketukan pada item belum aktif tidak menampilkan pesan */
  });

  // ---- skala kanvas native: desain dasar 360 dp, memenuhi lebar perangkat
  // Tinggi mengikuti app container agar safe-area dan viewport dinamis konsisten.
  // Cadangan tinggi untuk browser tanpa dukungan 100dvh (iOS < 15.4, Android WebView lama): 100vh di sana
  // termasuk area toolbar browser sehingga nav bawah tertutup. innerHeight selalu = area yang benar-benar terlihat.
  var lastAppH=document.documentElement.style.getPropertyValue('--app-h')||'',scaleFrame=0,lastK=0;
  function setH(){
    var h=Math.round(window.innerHeight)+'px';
    if(h!==lastAppH){
      lastAppH=h;
      document.documentElement.style.setProperty('--app-h',h);
    }
  }
  function setScale(){
    // Banyak sumber resize dapat aktif bersamaan di Android standalone.
    // Satu frame sudah cukup karena ukuran dibaca ulang saat callback berjalan.
    if(scaleFrame) return;
    scaleFrame=requestAnimationFrame(function(){
      scaleFrame=0;
      setH();
      var w=app.clientWidth,h=app.clientHeight;
      if(!w||!h) return;
      var k=w/360;
      if(k===lastK) return;            // ukuran sama: lewati (hindari relayout berulang)
      lastK=k;
      if(!('zoom' in document.documentElement.style)){
        ui.style.transformOrigin='0 0';
        ui.style.transform='scale('+k+')';
      } else {
        ui.style.zoom=k;
      }
      ui.style.setProperty('--k',k);
    });
  }
  setScale();
  addEventListener('resize',setScale,{passive:true});
  // Ukur ulang saat halaman tampil lagi, jendela fokus, atau tab kembali terlihat, plus beberapa kali sesaat setelah dibuka:
  // tinggi jendela PWA terpasang bisa baru final setelah bar sistem selesai menyesuaikan, sehingga ukuran awal bisa basi.
  addEventListener('focus',setScale,{passive:true});
  addEventListener('load',setScale,{passive:true});
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) setScale(); },{passive:true});
  [300,1200].forEach(function(t){ setTimeout(setScale,t); });
  addEventListener('orientationchange',setScale,{passive:true});
  addEventListener('pageshow',function(e){ if(e.persisted) setScale(); },{passive:true});
  if(window.visualViewport) window.visualViewport.addEventListener('resize',setScale,{passive:true});
  if(window.ResizeObserver){
    var appSizeObserver=new ResizeObserver(setScale);
    appSizeObserver.observe(app);
  }

  // ---- navigasi tab bawah (halaman terpisah)
  // Beranda -> tab lain: riwayat bertambah, jadi tombol back kembali ke Beranda.
  // Antar tab lain: location.replace, riwayat tidak menumpuk.
  document.addEventListener('click',function(e){
    var a=e.target.closest('a.ni'); if(!a) return;
    e.preventDefault();
    var n=a.getAttribute('data-tab'),href=a.getAttribute('href');
    if(n===TAB){var sc=$('.scroll');if(sc)sc.scrollTo({top:0,behavior:'smooth'});return}
    safe(function(){
      if(TAB==='Beranda'){sessionStorage.setItem('gp_home','1');GPL.go(href)}
      else if(n==='Beranda'&&sessionStorage.getItem('gp_home')==='1'&&history.length>1){sessionStorage.removeItem('gp_home');GPL.back(function(){history.back()})}
      else GPL.go(href,1);
    });
  });

  // ---- tombol back perangkat di Beranda: "tekan sekali lagi untuk keluar"
  if(TAB==='Beranda'){
    var armed=false,armT;
    safe(function(){ if(!(history.state&&history.state.g)){history.replaceState({root:1},'');history.pushState({g:1},'')} });
    addEventListener('popstate',function(e){
      if(!(e.state&&e.state.root)) return;
      if(armed){armed=false;clearTimeout(armT);safe(function(){history.back()});return}
      armed=true;GP.say('Tekan sekali lagi untuk keluar');
      safe(function(){history.pushState({g:1},'')});
      armT=setTimeout(function(){armed=false},2200);
    });
  }

  // ---- Pull to refresh: HANYA Beranda. Tarik CEPAT lalu lepas (atau tarik jauh) -> animasi bertahan 2 detik, lalu kembali otomatis.
  var ind=$('#ptr');
  if(ind){
    var svg=ind.querySelector('svg'),bgEl=$('#ptrbg');
    var TH=64,MAXP=114,busy=false,MSG='Diperbarui \u00b7 belum terhubung ke server',ICON=26.7,ICON_MAX=50;
    var attach=function(sc,base,useBg,o){
      o=o||{};
      var HOLD=o.hold||0,HOLD_GAP=o.holdGap||56,FLICK_MIN=o.flickMin||18,FLICK_V=o.flickV||0.25;
      var y0=null,x0=0,active=false,pull=0,raf=0,spin=0,spinning=false,last=0,pts=[];
      function curY(){try{return new DOMMatrix(getComputedStyle(sc).transform).m42}catch(_){return 0}}
      function render(g){
        if(g<0.5){ind.style.opacity=0;return}
        var size=Math.min(ICON_MAX,g*.62),sc_=size/ICON;
        ind.style.transform='translateY('+(base+g/2-16)+'px)';
        ind.style.opacity=Math.min(1,g/14);
        svg.style.transform='rotate('+(g*1.45+spin)+'deg) scale('+sc_.toFixed(3)+')';
        ind.classList.toggle('pg',g>=40);
        if(useBg&&bgEl) bgEl.style.opacity=1;
      }
      function tick(){
        var n=performance.now(); if(spinning) spin+=(n-last)*.45; last=n;
        render(curY());raf=requestAnimationFrame(tick);
      }
      function put(p){sc.style.transform='translateY('+p+'px)';render(p)}
      function finish(){
        cancelAnimationFrame(raf);spinning=false;spin=0;
        sc.style.transition='';sc.style.transform='';ind.style.opacity=0;ind.classList.remove('pg');svg.style.transform='';
        if(bgEl) bgEl.style.opacity=0;busy=false;
      }
      function back(done){
        sc.style.transition='transform .34s cubic-bezier(.2,.8,.2,1)';
        sc.style.transform='translateY(0px)';
        cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(tick);
        setTimeout(function(){finish();if(done)done()},380);
      }
      function release(refreshed){
        busy=true;
        if(refreshed&&HOLD){
          // tahan di posisi terbuka sambil ikon berputar, lalu kembali sendiri
          sc.style.transition='transform .22s cubic-bezier(.2,.8,.2,1)';
          sc.style.transform='translateY('+HOLD_GAP+'px)';
          spinning=true;cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(tick);
          window.dispatchEvent(new CustomEvent('gp:refresh'));
          setTimeout(function(){spinning=false;back()},HOLD);
          return;
        }
        back(null);
      }
      // kecepatan tarik (px/ms) dari sentuhan 120 ms terakhir; 0 bila jari sempat berhenti
      function velocity(){
        var n=pts.length; if(n<2) return 0;
        var l=pts[n-1]; if(performance.now()-l.t>150) return 0;
        var i=n-1; while(i>0&&l.t-pts[i-1].t<=120) i--;
        var dt=l.t-pts[i].t; return dt>0?(l.y-pts[i].y)/GP.k()/dt:0;
      }
      sc.addEventListener('touchstart',function(e){
        if(busy||e.touches.length!==1||sc.scrollTop>0){y0=null;return}
        y0=e.touches[0].clientY;x0=e.touches[0].clientX;active=false;pull=0;pts=[{t:performance.now(),y:y0}];
      },{passive:true});
      sc.addEventListener('touchmove',function(e){
        if(y0===null||busy) return;
        var t=e.touches[0],dy=(t.clientY-y0)/GP.k(),dx=Math.abs(t.clientX-x0)/GP.k();
        pts.push({t:performance.now(),y:t.clientY}); if(pts.length>8) pts.shift();
        if(!active){
          if(sc.scrollTop>0||dy<0){y0=null;return}
          if(dy<8) return;
          if(dx>dy){y0=null;return}
          active=true;sc.style.transition='none';
        }
        pull=MAXP*(1-Math.exp(-Math.max(0,dy)/170));
        put(pull);
        if(e.cancelable) e.preventDefault();
      },{passive:false});
      function end(e){
        if(!active){y0=null;return}
        active=false;y0=null;
        var ok=e.type==='touchend'&&(pull>=TH||(HOLD&&pull>=FLICK_MIN&&velocity()>=FLICK_V));
        release(ok);
      }
      sc.addEventListener('touchend',end);sc.addEventListener('touchcancel',end);
    };
    var s1=$('#scroll');
    if(s1&&TAB==='Beranda') attach(s1,0,true,{hold:2000});
  }

  // ---- Tampilan siap: transisi halus saat halaman muncul (untuk browser tanpa View Transitions)
  requestAnimationFrame(function(){ document.documentElement.classList.add('gp-ready'); });

  // ---- Banner offline: "Tidak ada koneksi" + kabar saat tersambung lagi
  var offEl=document.createElement('div');
  offEl.className='gp-off';offEl.setAttribute('role','status');offEl.setAttribute('aria-live','polite');
  if(app) app.appendChild(offEl);
  var offT;
  function netState(){
    clearTimeout(offT);
    if(navigator.onLine===false){
      offEl.textContent='Tidak ada koneksi \u2014 menampilkan data terakhir';
      offEl.classList.remove('ok');offEl.classList.add('show');
      window.dispatchEvent(new CustomEvent('gp:offline'));
    } else if(offEl.classList.contains('show')){
      offEl.textContent='Tersambung kembali';offEl.classList.add('ok');
      offT=setTimeout(function(){offEl.classList.remove('show')},1800);
      window.dispatchEvent(new CustomEvent('gp:online'));
    }
  }
  addEventListener('online',netState);addEventListener('offline',netState);
  GP.online=function(){return navigator.onLine!==false};
  if(navigator.onLine===false) netState();

  // ---- Keyboard layar: sembunyikan nav, gulirkan kolom isian ke area terlihat, pulihkan posisi saat keyboard tutup
  var vv=window.visualViewport,baseH=window.innerHeight,kbOn=false;
  function isField(el){return !!el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)&&!/^(button|checkbox|radio|submit|range)$/.test(el.type||'')||(!!el&&el.isContentEditable)}
  function vh(){return vv?vv.height:window.innerHeight}
  function kbCheck(){
    var f=isField(document.activeElement);
    if(!f) baseH=Math.max(baseH,window.innerHeight);
    var open=f&&(baseH-vh()>120);
    if(open!==kbOn){
      kbOn=open;document.documentElement.classList.toggle('gp-kb',open);
      if(!open){ safe(function(){app.scrollTop=0;document.documentElement.scrollTop=0;window.scrollTo(0,0)}); }
    }
  }
  function scroller(el){
    for(var p=el.parentElement;p&&p!==document.body;p=p.parentElement){
      var o=getComputedStyle(p).overflowY;
      if((o==='auto'||o==='scroll')&&p.scrollHeight>p.clientHeight+2) return p;
    }
    return null;
  }
  function reveal(el){
    var sc=scroller(el); if(!sc) return;
    var r=el.getBoundingClientRect(),cr=sc.getBoundingClientRect(),k=GP.k();
    var bottom=Math.min(cr.bottom,vv?vv.offsetTop+vv.height:cr.bottom)-16;
    if(r.bottom>bottom||r.top<cr.top+8){
      sc.scrollTo({top:sc.scrollTop+((r.top-cr.top)-(bottom-cr.top)/3)/k,behavior:'smooth'});
    }
  }
  document.addEventListener('focusin',function(e){
    if(!isField(e.target)) return;
    var t=e.target;setTimeout(function(){kbCheck();reveal(t)},320);
  });
  document.addEventListener('focusout',function(){ setTimeout(kbCheck,120); });
  if(vv) vv.addEventListener('resize',kbCheck,{passive:true});
  addEventListener('resize',kbCheck,{passive:true});

  // ---- Simpan & pulihkan posisi scroll tiap tab (seperti tab aplikasi native yang mempertahankan posisinya)
  (function(){
    if(!TAB) return;
    var sc=$('.scroll'); if(!sc) return;
    var key='gp_sy_'+TAB;
    function save(){ safe(function(){sessionStorage.setItem(key,String(Math.round(sc.scrollTop)))}); }
    function restore(){
      var y=+safe(function(){return sessionStorage.getItem(key)})||0; if(!y) return;
      sc.style.scrollBehavior='auto';sc.scrollTop=y;
      requestAnimationFrame(function(){sc.scrollTop=y;sc.style.scrollBehavior=''});
    }
    restore();
    addEventListener('load',function(){ if(sc.scrollTop<2) restore(); });
    addEventListener('pagehide',save);
    document.addEventListener('visibilitychange',function(){ if(document.hidden) save(); });
    document.addEventListener('click',function(e){ if(e.target.closest('a.ni')) save(); },true);
    GP.resetScroll=function(){ safe(function(){sessionStorage.removeItem(key)}); };
  })();

  // ---- Getaran halus saat menyentuh tab bawah & tombol
  document.addEventListener('pointerdown',function(e){
    var el=e.target.closest&&e.target.closest('.ni,button:not([data-t]),[data-page]');
    if(el) GP.haptic('tap');
  },{passive:true});
})();

</script>
<script>/* js/masuk.js */
/* masuk.js — alur keluar/masuk: onboarding -> nomor HP -> PIN. Aturan visual ada di css/masuk.css */
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s)};
  function safe(f){try{return f()}catch(_){}}
  var P=document.body.getAttribute('data-p');
  var GM=window.GPMasuk=window.GPMasuk||{};

  /* Titik sambung ke server. Isi dengan pemeriksaan PIN sebenarnya (mis. Supabase) lalu kembalikan Promise<true|false>.
     Bawaan: belum ada skema PIN di server, jadi PIN 6 digit apa pun diterima. */
  GM.verifikasi=GM.verifikasi||function(hp,pin){return Promise.resolve(true)};
  GM.tujuan='index.html';   // halaman setelah berhasil masuk

  function nomorBersih(v){
    v=String(v||'').replace(/\D/g,'');
    if(v.indexOf('62')===0&&v.length>11) v=v.slice(2);
    return v.replace(/^0+/,'');
  }

  if(P==='onb'){
    $('#go-hp').addEventListener('click',function(){GPL.go('masuk.html')});
  }

  if(P==='hp'){
    var inp=$('#hp'),go=$('#hp-lanjut');
    // nomor terakhir yang tersimpan (cache profil) ditampilkan lagi, seperti referensi
    safe(function(){var c=JSON.parse(localStorage.getItem('profil_cache_v1')||'null'); if(c&&c.nomor_hape) inp.value=nomorBersih(c.nomor_hape).slice(0,13);});
    function valid(v){return v.length>=9&&v.length<=13&&v.charAt(0)==='8'}
    function sinkron(){
      var ok=valid(nomorBersih(inp.value));
      go.classList.toggle('off',!ok);
      go.setAttribute('aria-disabled',ok?'false':'true');
    }
    inp.addEventListener('input',function(){
      var v=inp.value.replace(/\D/g,'').replace(/^0+/,'');
      if(v!==inp.value) inp.value=v;
      sinkron();
    });
    sinkron();
    function lanjut(){
      var v=nomorBersih(inp.value);
      if(!valid(v)){ inp.focus(); return; }   // tombol nonaktif: tidak ada pesan, sesuai acuan
      safe(function(){sessionStorage.setItem('gp_hp',v)});
      GPL.go('pin.html');
    }
    go.addEventListener('click',lanjut);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();inp.blur();lanjut();} });
    $('#hp-back').addEventListener('click',function(){GP.back('onboarding.html')});
  }

  if(P==='pin'){
    var box=$('#pbox'),dots=[].slice.call(box.querySelectorAll('i')),pin='',busy=false;
    function paint(){
      dots.forEach(function(d,i){d.classList.toggle('f',i<pin.length)});
      box.setAttribute('aria-label','PIN, '+pin.length+' dari 6 digit');
    }
    function gagal(msg){
      busy=false; pin=''; GP.haptic('err'); GPL.hideNow();
      box.classList.remove('err'); void box.offsetWidth; box.classList.add('err');
      setTimeout(paint,260); GP.say(msg||'PIN salah, coba lagi');
    }
    function kirim(){
      busy=true; GPL.show(15000);   // verifikasi PIN ke server: loader tampil sampai berhasil pindah/gagal
      var hp=safe(function(){return sessionStorage.getItem('gp_hp')})||'';
      var pr=safe(function(){return GM.verifikasi(hp,pin)});
      Promise.resolve(pr).then(function(ok){
        if(ok===false) return gagal();
        GP.haptic('ok');
        safe(function(){sessionStorage.removeItem('gp_hp')});
        GP.masuk();   // sesi aktif lagi
        GPL.go(GM.tujuan,1);
      },function(){gagal('Gagal memeriksa PIN. Periksa koneksi.')});
    }
    function tekan(k){
      if(busy) return;
      if(k==='del'){ pin=pin.slice(0,-1); paint(); return; }
      if(pin.length>=6) return;
      pin+=k; paint();
      if(pin.length===6) setTimeout(kirim,140);
    }
    $('#pad').addEventListener('click',function(e){
      var b=e.target.closest('[data-k]'); if(b) tekan(b.getAttribute('data-k'));
    });
    document.addEventListener('keydown',function(e){   // papan ketik fisik (desktop)
      if(/^[0-9]$/.test(e.key)) tekan(e.key); else if(e.key==='Backspace') tekan('del');
    });
    $('#pin-x').addEventListener('click',function(){GP.back('masuk.html')});
  }
})();

</script>
<script>/* update.js */
/* update.js — pasang sekali di index.html (<script src="update.js"><\/script>), tidak perlu diubah lagi.
   Mendaftarkan sw.js tanpa cache HTTP, mengecek pembaruan tiap aplikasi dibuka/kembali aktif/tiap 5 menit,
   dan menawarkan muat ulang lewat toast saat ada versi baru (tanpa reload mendadak). */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var reloading = false, pending = false, bar = null;
  var hadController = !!navigator.serviceWorker.controller;   // pemasangan pertama (belum ada controller) tidak dianggap pembaruan
  function reload() {
    if (reloading) return; reloading = true;
    try { sessionStorage.setItem('upd_t', String(Date.now())); } catch (_) {}
    location.reload();                                         // posisi scroll tab disimpan core.js (pagehide) dan dipulihkan
  }
  function recentlyReloaded() {                       // cegah loop reload
    try { return Date.now() - Number(sessionStorage.getItem('upd_t') || 0) < 15000; } catch (_) { return false; }
  }
  function sedangMengetik() {                         // jangan ganggu pengguna yang sedang mengisi sesuatu
    var a = document.activeElement;
    return !!a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable);
  }
  /* Pembaruan tersedia: tampilkan toast "Muat ulang" (tidak memuat ulang mendadak).
     Diterapkan otomatis saat aplikasi di latar belakang dan pengguna tidak sedang mengetik. */
  function tawarkan() {
    if (pending || recentlyReloaded()) return;
    pending = true;
    var host = document.getElementById('app') || document.body;
    bar = document.createElement('div');
    bar.className = 'gp-upd'; bar.setAttribute('role', 'status');
    bar.innerHTML = '<span>Pembaruan tersedia</span><button type="button" class="go">Muat ulang</button><button type="button" class="x" aria-label="Nanti saja">\u00d7</button>';
    host.appendChild(bar);
    requestAnimationFrame(function () { requestAnimationFrame(function () { bar.classList.add('show'); }); });
    bar.querySelector('.go').addEventListener('click', reload);
    bar.querySelector('.x').addEventListener('click', function () { bar.classList.remove('show'); });
    if (window.GP && GP.haptic) GP.haptic('ok');
  }
  document.addEventListener('visibilitychange', function () {   // aplikasi pindah ke latar belakang: aman memuat ulang tanpa terlihat
    if (document.hidden && pending && !sedangMengetik()) reload();
  });
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadController && !recentlyReloaded()) tawarkan(); hadController = true; });
  /* Suara notifikasi: mynotification.mp3 dibunyikan saat push masuk dan aplikasi sedang terbuka.
     Browser mewajibkan satu sentuhan pengguna dulu, jadi audio "dibuka kuncinya" pada interaksi pertama. */
  var bunyi = null;
  function siapAudio() { if (!bunyi) { bunyi = new Audio('mynotification.mp3'); bunyi.preload = 'auto'; } return bunyi; }
  function bukaKunci() {
    ['pointerdown', 'keydown', 'touchstart'].forEach(function (n) { document.removeEventListener(n, bukaKunci, true); });
    try {
      var a = siapAudio(); a.muted = true;
      var p = a.play();
      var selesai = function () { a.pause(); a.currentTime = 0; a.muted = false; };
      if (p && p.then) p.then(selesai).catch(function () { a.muted = false; }); else selesai();

  var terakhir = 0;
  function bunyikan() {
    if (document.hidden) return;
    var n = Date.now(); if (n - terakhir < 1500) return;          // realtime + web push untuk transaksi yang sama: satu bunyi
    terakhir = n;
    try { var a = siapAudio(); a.currentTime = 0; var p = a.play(); if (p && p.catch) p.catch(function () {}); } catch (_) {}

  });
  function cek(reg) {
    var n = Date.now(), t = 0; try { t = Number(sessionStorage.getItem('upd_chk') || 0); } catch (_) {}
    if (n - t < 60000) return;                        // maks. 1x / menit, bukan tiap pindah tab

    var kirim = function () {

  window.addEventListener('load', function () {

  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {

    document.addEventListener('visibilitychange', function () { if (!document.hidden) cek(reg); });
    window.addEventListener('online', function () { cek(reg); });
    setInterval(function () { if (!document.hidden) cek(reg); }, 5 * 60 * 1000);
  }).catch(function () {});
})();
